name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p _site
          tar -xzf site.tar.gz -C _site
          xz -dc index.html.xz > _site/index.html
          if [ -d overrides ]; then
            cp -R overrides/. _site/
          fi
          if [ -d assets ]; then
            mkdir -p _site/assets
            cp -R assets/. _site/assets/
          fi
          while IFS= read -r -d '' page; do
            if ! grep -q '/assets/universal-media.css' "$page"; then
              sed -i 's#</head>#<link rel="stylesheet" href="/assets/universal-media.css"></head>#' "$page"
            fi
          done < <(find _site -type f -name '*.html' -print0)

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
