name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build and validate clean static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Publish only reviewed static pages and assets.
          cp -R overrides/. _site/
          mkdir -p _site/assets
          cp -R assets/. _site/assets/

          for f in favicon.ico favicon.svg favicon-96.png apple-touch-icon.png site.webmanifest .nojekyll \
                   google4d4487812e36d65c.html yandex_d89618159a40495b.html yandex_e868ce83ed0c1276.html \
                   c25441bbac42b588dd51fcf237159c69.txt; do
            test -f "$f"
            cp "$f" "_site/$f"
          done

          # Stage 20: strengthen the Telegram topic cluster in the published static HTML.
          python scripts/stage20_patch.py _site

          # Stage 21: connect the Telegram service entity and add public proof to the profile.
          python scripts/stage21_entity_patch.py _site

          # Stage 22: assign broad "website development" intent to the web-development page.
          python scripts/stage22_broad_intent_patch.py _site

          # Stage 23: make Telegram project ownership and handoff explicit.
          python scripts/stage23_telegram_handoff_patch.py _site

          # Stage 24: one shared outer shell across every page family.
          python scripts/stage24_layout_system.py _site

          # Stage 25 audit: report cross-template navigation/footer drift.
          python scripts/stage25_navigation_audit.py _site

          # Parser-based validation: independent of HTML attribute order.
          python scripts/validate_site.py _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow about changed URLs
        continue-on-error: true
        shell: bash
        env:
          INDEXNOW_KEY: "c25441bbac42b588dd51fcf237159c69"
        run: |
          set -u
          python - <<'PY2'
          import json, os, subprocess, xml.etree.ElementTree as ET

          host = 'alexgtup.github.io'
          base = 'https://alexgtup.github.io'
          key = os.environ['INDEXNOW_KEY']
          changed = []
          try:
              names = subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'], text=True).splitlines()
          except Exception:
              names = []

          def sitemap_urls():
              tree = ET.parse('overrides/sitemap.xml')
              ns = {'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
              return [n.text.strip() for n in tree.findall('.//s:loc', ns)]

          if any(name == f'{key}.txt' for name in names) or not names:
              changed = sitemap_urls()
          else:
              global_frontend = {
                  'assets/site-enhancements.css',
                  'assets/search-intent.css',
                  'assets/international.css',
                  'assets/universal-media.css',
                  'assets/site-enhancements.js',
                  'assets/layout-system.css',
              }
              if any(name in global_frontend for name in names):
                  changed = sitemap_urls()

              if 'scripts/stage24_layout_system.py' in names or '.github/workflows/deploy-pages.yml' in names:
                  changed += sitemap_urls()

              if 'scripts/stage20_patch.py' in names:
                  changed += [
                      base + '/telegram-bots/',
                      base + '/cases/fin-planner/',
                      base + '/guides/telegram-bot-cost/',
                      base + '/guides/telegram-bot-brief/',
                      base + '/guides/bot-vs-mini-app-vs-web/',
                      base + '/services/',
                  ]

              if 'scripts/stage21_entity_patch.py' in names:
                  changed += [
                      base + '/telegram-bots/',
                      base + '/about/',
                  ]

              if 'scripts/stage22_broad_intent_patch.py' in names:
                  changed += [
                      base + '/web-development/',
                      base + '/',
                      base + '/services/',
                  ]

              if 'scripts/stage23_telegram_handoff_patch.py' in names:
                  changed.append(base + '/telegram-bots/')

              for name in names:
                  if name == 'overrides/index.html':
                      changed.append(base + '/')
                  elif name.startswith('overrides/') and name.endswith('/index.html'):
                      route = name[len('overrides/'):-len('index.html')]
                      changed.append(base + '/' + route)
                  elif name.startswith('assets/cases/fin-planner/'):
                      changed += [base+'/', base+'/cases/fin-planner/']
                  elif name.startswith('assets/cases/swift-calendar/'):
                      changed += [base+'/', base+'/cases/swift-calendar/']

          changed = sorted(set(changed))
          payload = {
              'host': host,
              'key': key,
              'keyLocation': f'{base}/{key}.txt',
              'urlList': changed,
          }
          with open('/tmp/indexnow.json','w',encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False)
          print(f'IndexNow URLs: {len(changed)}')
          PY2

          COUNT=$(python -c "import json; print(len(json.load(open('/tmp/indexnow.json'))['urlList']))")
          if [ "$COUNT" -gt 0 ]; then
            CODE=$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' \
              -H 'Content-Type: application/json; charset=utf-8' \
              --data-binary @/tmp/indexnow.json \
              https://api.indexnow.org/indexnow || true)
            echo "IndexNow HTTP: $CODE"
            cat /tmp/indexnow-response.txt || true
          else
            echo 'No changed public URLs to submit.'
          fi