name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build and validate clean static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          cp -R overrides/. _site/
          mkdir -p _site/assets
          cp -R assets/. _site/assets/

          for f in favicon.ico favicon.svg favicon-96.png apple-touch-icon.png site.webmanifest .nojekyll \
                   google4d4487812e36d65c.html yandex_d89618159a40495b.html yandex_e868ce83ed0c1276.html \
                   *.txt; do
            test -f "$f"
            cp "$f" "_site/$f"
          done

          # DevTools pages keep their own visual system but join the shared .container invariant before Stage24.
          python scripts/stage67_devtools_hub.py _site
          python scripts/stage20_patch.py _site
          python scripts/stage21_entity_patch.py _site
          python scripts/stage22_broad_intent_patch.py _site
          python scripts/stage23_telegram_handoff_patch.py _site
          python scripts/stage24_layout_system.py _site
          python scripts/stage25_navigation_patch.py _site
          python scripts/stage37_accessibility_patch.py _site
          python scripts/stage39_growth_patch.py _site
          python scripts/stage40_trust_patch.py _site
          python scripts/stage58_sheetpilot_case.py _site
          python scripts/stage59_sheetpilot_grid_fix.py _site
          python scripts/stage60_project_carousel.py _site
          python scripts/stage61_seo_control_center_case.py _site
          python scripts/stage66_siteaudit_case.py _site
          # Re-assert sitemap, crosslinks and services entry after later page rebuilds.
          python scripts/stage67_devtools_hub.py _site
          # FreelanceOS joins the final project grid and gets production hardening before analytics/validation.
          python scripts/stage68_freelanceos.py _site
          python scripts/stage69_freelanceos_hardening.py _site
          python scripts/stage70_freelanceos_responsive.py _site
          # Keep a second machine-readable discovery path aligned with key sitemap targets.
          python scripts/stage71_feed_discovery.py _site
          # Keep the Freelance.ru landing aligned with the actual packaged offers.
          python scripts/stage72_freelance_offer_hub.py _site
          node --check _site/assets/freelance-os.js

          python - <<'PY3'
          from pathlib import Path
          p = Path('_site/cases/sheetpilot-ai/index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('Публичное демо — <em>следующий шаг.</em>', 'Публичное демо — <em>уже работает.</em>')
          text = text.replace('Кейс уже опубликован как рабочий MVP. После размещения backend добавлю сюда кнопку «Открыть демо», чтобы можно было загрузить тестовый Excel и проверить обработку прямо из портфолио.', 'SheetPilot AI уже развёрнут как публичный сервис. Можно открыть демо, загрузить Excel-файл, описать изменение обычным языком, проверить предпросмотр и скачать новый файл.')
          text = text.replace('<span class="btn status">Демо готовится к публикации</span>', '<a class="btn primary" href="https://sheetpilot-ai-6omr.onrender.com" target="_blank" rel="noopener noreferrer">Открыть демо ↗</a>')
          text = text.replace('Публичную демо-версию добавлю после отдельного развёртывания сервиса.', 'Публичная демо-версия уже развёрнута и доступна для тестирования.')
          p.write_text(text, encoding='utf-8')
          PY3

          python scripts/stage64_conversion_paths.py _site
          python scripts/stage65_analytics_centralization.py _site
          python scripts/stage62_search_and_conversion.py _site
          python scripts/stage64_conversion_paths.py _site
          python scripts/stage63_scc_production_demo.py _site
          python scripts/stage65_analytics_centralization.py _site --check
          node --test tests/analytics.test.cjs
          # Patch/check the final generated HTML after all trust/conversion layers.
          python scripts/stage73_trust_freshness.py _site
          # Make the responsible author visible on cases and the decision guides that lacked a byline.
          python scripts/stage75_visible_authorship.py _site
          # Tune only proven Yandex query/page pairs from the latest Webmaster export.
          python scripts/stage76_yandex_serp_tuning.py _site
          # Audit every sitemap page and strengthen only the weak search entries.
          python scripts/stage77_sitewide_search_quality.py _site
          python scripts/validate_growth.py _site
          python scripts/stage25_navigation_audit.py _site
          python scripts/stage27_endings_audit.py _site
          python scripts/stage28_overflow_audit.py _site
          python scripts/stage30_nested_container_audit.py _site
          python scripts/stage32_rhythm_audit.py _site
          python scripts/stage35_responsive_risk_audit.py _site
          python scripts/stage36_language_a11y_audit.py _site
          python scripts/validate_site.py _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow and Yandex from final sitemap
        continue-on-error: true
        shell: bash
        run: |
          set -u
          python - <<'PY2'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          base = 'https://alexgtup.github.io'
          host = 'alexgtup.github.io'
          key = None
          for path in Path('_site').glob('*.txt'):
              value = path.read_text(encoding='utf-8').strip()
              if len(path.stem) == 32 and value == path.stem:
                  key = value
                  break
          if not key:
              raise SystemExit('IndexNow key file not found in published site')

          tree = ET.parse('_site/sitemap.xml')
          ns = {'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = sorted({(n.text or '').strip() for n in tree.findall('.//s:loc', ns) if (n.text or '').strip()})
          payload = {
              'host': host,
              'key': key,
              'keyLocation': f'{base}/{key}.txt',
              'urlList': urls,
          }
          with open('/tmp/indexnow.json','w',encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False)
          print(f'IndexNow URLs from final sitemap: {len(urls)}')
          PY2

          for ENDPOINT in https://api.indexnow.org/indexnow https://yandex.com/indexnow; do
            CODE=$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' \
              -H 'Content-Type: application/json; charset=utf-8' \
              --data-binary @/tmp/indexnow.json \
              "$ENDPOINT" || true)
            echo "$ENDPOINT HTTP: $CODE"
            cat /tmp/indexnow-response.txt || true
            echo
          done