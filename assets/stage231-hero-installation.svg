<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">Digital product system</title><desc id="desc">Центральная сфера и панели Telegram, автоматизации, аналитики, WordPress и данных</desc>
<defs>
 <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop stop-color="#9aa9ff" stop-opacity=".36"/><stop offset=".46" stop-color="#765df2" stop-opacity=".14"/><stop offset=".74" stop-color="#76e8ff" stop-opacity=".07"/><stop offset="1" stop-opacity="0"/></radialGradient>
 <radialGradient id="limeHalo" cx="50%" cy="50%" r="50%"><stop stop-color="#caff62" stop-opacity=".32"/><stop offset="1" stop-opacity="0"/></radialGradient>
 <radialGradient id="orb" cx="36%" cy="28%" r="72%"><stop stop-color="#dbe5ff" stop-opacity=".86"/><stop offset=".06" stop-color="#8aa3ff" stop-opacity=".46"/><stop offset=".23" stop-color="#263563"/><stop offset=".58" stop-color="#10152b"/><stop offset="1" stop-color="#03060c"/></radialGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1c2942" stop-opacity=".86"/><stop offset=".42" stop-color="#0b111c" stop-opacity=".88"/><stop offset="1" stop-color="#05090f" stop-opacity=".94"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a9baff"/><stop offset=".42" stop-color="#7187ff"/><stop offset=".72" stop-color="#bda4ff"/><stop offset="1" stop-color="#caff62"/></linearGradient>
 <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172039"/><stop offset=".5" stop-color="#090d17"/><stop offset="1" stop-color="#020409"/></linearGradient>
 <filter id="blur28"><feGaussianBlur stdDeviation="28"/></filter>
 <filter id="blur10"><feGaussianBlur stdDeviation="10"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".46"/></filter>
 <clipPath id="round"><rect width="100" height="64" rx="10"/></clipPath>
</defs>
<ellipse cx="518" cy="380" rx="322" ry="254" fill="url(#halo)" filter="url(#blur28)"/>
<ellipse cx="650" cy="350" rx="220" ry="170" fill="url(#limeHalo)" filter="url(#blur28)" opacity=".9"/>
<g opacity=".52" fill="none" stroke="#879cff" stroke-width="1.2">
