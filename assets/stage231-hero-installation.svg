 <ellipse cx="515" cy="356" rx="246" ry="84" transform="rotate(18 515 356)" opacity=".64"/>
 <ellipse cx="515" cy="356" rx="196" ry="64" transform="rotate(68 515 356)" opacity=".34"/>
</g>
