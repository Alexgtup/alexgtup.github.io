 <rect x="20" y="100" width="105" height="58" rx="8" fill="#101722" stroke="#7386c9" stroke-opacity=".3"/><rect x="140" y="100" width="126" height="58" rx="8" fill="#dfe7f1"/><rect x="151" y="112" width="104" height="9" rx="3" fill="#91a7ff"/><rect x="151" y="128" width="72" height="6" rx="3" fill="#b8c0ce"/><rect x="151" y="140" width="92" height="6" rx="3" fill="#b8c0ce"/>
</g>
