<circle cx="480" cy="320" r="7" fill="#fff" opacity=".8" filter="url(#glow)"/>
<text x="515" y="340" text-anchor="middle" fill="#dbe1ef" font-family="Arial,sans-serif" font-size="8" letter-spacing="2">IDEAS</text>
