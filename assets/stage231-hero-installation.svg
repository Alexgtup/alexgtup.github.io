 <path d="M356 556 L455 590 L686 554" fill="none" stroke="#caff62" stroke-opacity=".62" filter="url(#glow)"/>
 <path d="M455 590 L455 650" stroke="#8ea3ff" stroke-opacity=".38"/><path d="M688 554 L688 610" stroke="#8ea3ff" stroke-opacity=".3"/>
