<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 820" preserveAspectRatio="xMidYMax slice">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#02050a"/><stop offset=".45" stop-color="#060a12"/><stop offset="1" stop-color="#010204"/></linearGradient>
 <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b2232"/><stop offset="1" stop-color="#070a0f"/></linearGradient>
